name: Start OpenSearch
description: Configures and starts an OpenSearch daemon
inputs:
  opensearch_args:
    description: Additional arguments to pass to the OpenSearch process
    default: ''
  secured:
    description: Whether to enable the security plugin
    default: 'false'
outputs:
  opensearch_url:
    description: The URL where the OpenSearch node is accessible
    value: ${{ steps.opensearch.outputs.url }}
  admin_password:
    description: The initial admin password
    value: ${{ steps.opensearch.outputs.password }}
runs:
  using: composite
  steps:
    - name: Start OpenSearch
      id: opensearch
      shell: bash -eo pipefail {0}
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install -q coreutils
        fi
        unset JAVA_HOME
        OPENSEARCH_HOME=$(realpath ./opensearch-[1-9]*)
        CONFIG_DIR=$OPENSEARCH_HOME/config
        CONFIG_FILE=$CONFIG_DIR/opensearch.yml
        SECURITY_DIR=$OPENSEARCH_HOME/plugins/opensearch-security
        QUERY_INSIGHTS_DIR=$OPENSEARCH_HOME/plugins/query-insights
        OPENSEARCH_JAVA_OPTS="-Djava.net.preferIPv4Stack=true"

        URL="http://localhost:9200"
        cp ./client/.ci/opensearch/opensearch.yml $CONFIG_FILE

        # The query-insights plugin defaults its top N queries exporter to `local_index`, which
        # periodically creates `top_queries-<date>-<hash>` indexes. Those indexes are not created by
        # the tests but are visible to them, breaking YAML tests that assert on cluster-wide shard
        # listings or counts. Set the exporter to `none` so no such index is created.
        #
        # The setting only exists in query-insights 2.19 and later, and an unknown setting in
        # opensearch.yml stops the node from starting, so gate on the plugin's own version. Checking
        # only that the plugin directory exists is not enough: 2.16 and 2.17 bundle the plugin but
        # register no exporter settings.
        if [[ -d "$QUERY_INSIGHTS_DIR" ]]; then
          QUERY_INSIGHTS_VERSION=$(cat $QUERY_INSIGHTS_DIR/plugin-descriptor.properties | grep '^version=' | cut -d'=' -f 2)
          QUERY_INSIGHTS_VERSION_COMPONENTS=(${QUERY_INSIGHTS_VERSION//./ })
          QUERY_INSIGHTS_MAJOR="${QUERY_INSIGHTS_VERSION_COMPONENTS[0]}"
          QUERY_INSIGHTS_MINOR="${QUERY_INSIGHTS_VERSION_COMPONENTS[1]}"
          if (( $QUERY_INSIGHTS_MAJOR > 2 || ( $QUERY_INSIGHTS_MAJOR == 2 && $QUERY_INSIGHTS_MINOR >= 19 ) )); then
            printf "\nsearch.insights.top_queries.exporter.type: none" >> $CONFIG_FILE
          fi
        fi

        bash ./client/.ci/generate-certs.sh
        
        export OPENSEARCH_INITIAL_ADMIN_PASSWORD=admin

        if [[ -d "$SECURITY_DIR" ]]; then
          if [[ "$SECURED" == "true" ]]; then
            SECURITY_VERSION=$(cat $SECURITY_DIR/plugin-descriptor.properties | grep '^version=' | cut -d'=' -f 2)
            SECURITY_VERSION_COMPONENTS=(${SECURITY_VERSION//./ })
            SECURITY_MAJOR="${SECURITY_VERSION_COMPONENTS[0]}"
            SECURITY_MINOR="${SECURITY_VERSION_COMPONENTS[1]}"
        
            if (( $SECURITY_MAJOR > 2 || ( $SECURITY_MAJOR == 2 && $SECURITY_MINOR >= 12 ) )); then
              export OPENSEARCH_INITIAL_ADMIN_PASSWORD="myStrongPassword123!"
            fi
        
            bash "$SECURITY_DIR/tools/install_demo_configuration.sh" -y -i -s
        
            sed -i.bak -e 's/plugins.security.audit.type:.*/plugins.security.audit.type: log4j/' $CONFIG_FILE
            cp ./client/.ci/opensearch/*.pem $CONFIG_DIR/
            URL="https://localhost:9200"
          else
            printf "\nplugins.security.disabled: true" >> $CONFIG_FILE
          fi
        fi

        if [[ "$RUNNER_OS" == "macOS" ]]; then
          sed -i.bak -e 's/bootstrap.memory_lock:.*/bootstrap.memory_lock: false/' $CONFIG_FILE
        fi

        {
          echo "url=$URL"
          echo "password=$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
        } | tee -a $GITHUB_OUTPUT
        
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
        fi

        if [[ "$RUNNER_OS" != "Windows" ]]; then
          $OPENSEARCH_HOME/bin/opensearch ${OPENSEARCH_ARGS} &
        else
          $OPENSEARCH_HOME/bin/opensearch.bat ${OPENSEARCH_ARGS} -d &
        fi

        for attempt in {1..20}; do
          sleep 5
          if curl -k -sS --cacert ./client/.ci/certs/root-ca.crt -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} $URL; then
            echo '=====> ready'
            exit 0
          fi
          echo '=====> waiting...'
        done
        exit 1
      env:
        SECURED: ${{ inputs.secured }}
        RUNNER_OS: ${{ runner.os }}
        OPENSEARCH_ARGS: ${{ inputs.opensearch_args }}
